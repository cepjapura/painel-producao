<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Produção — Suze Bolsas</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700;800&display=swap');

  :root{
    --linen: #FAF5EE;
    --linen-deep: #F1E7D9;
    --ink: #3B332C;
    --ink-soft: #7A6F63;
    --rose: #B5687A;
    --rose-deep: #954F60;
    --line: #E4D8C6;
    --card: #FFFFFF;
    --wait: #C79A4B; --wait-bg: #FBF1DD;
    --bordado: #9B6FB0; --bordado-bg: #F1E7F5;
    --costura: #6C8FA6; --costura-bg: #E8F0F5;
    --pronto: #7C8A6B; --pronto-bg: #ECF1E7;
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0;}
  body{
    background: var(--linen);
    font-family: 'Public Sans', sans-serif;
    color: var(--ink);
    min-height:100vh;
    display:flex;
    justify-content:center;
  }
  .phone{ width:100%; max-width:430px; min-height:100vh; background: var(--linen); padding-bottom: 40px; }

  header{
    padding: 28px 20px 18px;
    background: linear-gradient(180deg, var(--linen-deep) 0%, var(--linen) 100%);
    border-bottom: 1px solid var(--line);
    position:sticky; top:0; z-index:5;
  }
  .eyebrow{ font-size:11px; letter-spacing:.14em; text-transform:uppercase; color: var(--rose-deep); font-weight:700; margin-bottom:4px; }
  h1{ font-family:'Fraunces', serif; font-size:28px; font-weight:600; margin:0; line-height:1.1; }
  .stitch{ border:none; border-top: 2px dashed var(--line); margin: 16px 0 0; }

  .tabs{ display:flex; gap:8px; padding: 14px 20px 4px; overflow-x:auto; }
  .tab{ flex:0 0 auto; padding: 9px 16px; border-radius: 999px; font-size:14px; font-weight:600; background: var(--card); border:1px solid var(--line); color: var(--ink-soft); white-space:nowrap; cursor:pointer; }
  .tab.active{ background: var(--rose); border-color: var(--rose); color:#fff; }
  .tab .dot{ display:inline-block; width:7px;height:7px; border-radius:50%; margin-right:6px; }

  .feed{ padding: 14px 16px 10px; display:flex; flex-direction:column; gap:14px; }
  .empty{ text-align:center; padding: 60px 20px; color: var(--ink-soft); }
  .empty .big{ font-size:40px; margin-bottom:10px; }

  .card{ background: var(--card); border-radius: 18px; border: 1px solid var(--line); overflow:hidden; box-shadow: 0 2px 10px rgba(59,51,44,0.05); cursor:pointer; }
  .card .top{ display:flex; }
  .thumb{ width:88px; height:88px; flex:0 0 88px; background: var(--linen-deep); display:flex; align-items:center; justify-content:center; font-size:26px; border-right:1px solid var(--line); overflow:hidden; }
  .thumb img{ width:100%; height:100%; object-fit:cover; }
  .thumb.b{ border-right:none; }
  .thumbs-wrap{ display:flex; }
  .info{ flex:1; padding: 12px 14px; min-width:0; }
  .info .name{ font-family:'Fraunces', serif; font-weight:600; font-size:17px; margin:0 0 2px; }
  .info .product{ font-size:13.5px; color: var(--ink-soft); line-height:1.35; margin:0; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .meta-row{ display:flex; align-items:center; justify-content:space-between; padding: 0 14px 12px; }
  .prazo{ font-size:12.5px; color: var(--ink-soft); font-weight:600; }
  .prazo b{ color: var(--ink); }
  .status-pill{ font-size:12px; font-weight:700; padding: 6px 12px; border-radius:999px; }

  .backdrop{ position:fixed; inset:0; background:rgba(59,51,44,0.45); display:none; align-items:flex-end; justify-content:center; z-index:20; }
  .backdrop.open{ display:flex; }
  .sheet{ width:100%; max-width:430px; background: var(--linen); border-radius: 24px 24px 0 0; max-height:88vh; overflow-y:auto; padding: 10px 20px 28px; }
  .grabber{ width:40px; height:4px; background:var(--line); border-radius:99px; margin: 6px auto 14px; }
  .sheet h2{ font-family:'Fraunces', serif; font-size:24px; margin:0 0 2px; }
  .sheet .sub{ color:var(--ink-soft); font-size:13px; margin-bottom:16px; }
  .photo-row{ display:flex; gap:10px; margin-bottom:16px; }
  .photo-box{ flex:1; aspect-ratio:1; background: var(--linen-deep); border-radius:14px; border:1px solid var(--line); display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:30px; gap:4px; overflow:hidden; position:relative; }
  .photo-box img{ width:100%; height:100%; object-fit:cover; position:absolute; inset:0; }
  .photo-box small{ font-size:11px; color:var(--ink-soft); font-weight:600; z-index:1; background:rgba(255,255,255,0.85); padding:2px 6px; border-radius:6px; position:absolute; bottom:6px; }
  .detail-block{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:14px; }
  .detail-block .k{ font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--rose-deep); font-weight:700; margin-bottom:4px; }
  .detail-block .v{ font-size:15px; line-height:1.5; }
  .status-buttons{ display:flex; flex-direction:column; gap:10px; margin-top:6px; }
  .status-btn{ display:flex; align-items:center; gap:10px; padding:14px 16px; border-radius:14px; border:1.5px solid var(--line); background:var(--card); font-family:'Public Sans',sans-serif; font-size:15px; font-weight:700; color:var(--ink); text-align:left; width:100%; }
  .status-btn .dot{ width:10px; height:10px; border-radius:50%; flex:0 0 10px; }
  .close-btn{ width:100%; margin-top:6px; padding:14px; border-radius:14px; border:none; background:var(--rose); color:#fff; font-weight:700; font-size:15px; font-family:'Public Sans',sans-serif; }
  .loading{ text-align:center; padding:60px 20px; color:var(--ink-soft); }
</style>
</head>
<body>
<div class="phone">
  <header>
    <div class="eyebrow">Suze Bolsas</div>
    <h1>Painel de Produção</h1>
    <hr class="stitch">
  </header>

  <div class="tabs" id="tabs">
    <div class="tab active" data-filter="pendentes">Pendentes</div>
    <div class="tab" data-filter="aguardando"><span class="dot" style="background:var(--wait)"></span>Aguardando</div>
    <div class="tab" data-filter="bordado"><span class="dot" style="background:var(--bordado)"></span>Bordado</div>
    <div class="tab" data-filter="costura"><span class="dot" style="background:var(--costura)"></span>Costura</div>
    <div class="tab" data-filter="pronto"><span class="dot" style="background:var(--pronto)"></span>Prontos</div>
  </div>

  <div class="feed" id="feed"><div class="loading">Carregando pedidos...</div></div>
</div>

<div class="backdrop" id="backdrop">
  <div class="sheet" id="sheet"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, onSnapshot, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ── CONFIGURAÇÃO DO SEU PROJETO FIREBASE ──
const firebaseConfig = {
  apiKey: "AIzaSyBF1VTk-g3PC0gwagGJHqOyaReCn1EkMvM",
  authDomain: "suze-bolsas.firebaseapp.com",
  projectId: "suze-bolsas",
  storageBucket: "suze-bolsas.firebasestorage.app",
  messagingSenderId: "391895865141",
  appId: "1:391895865141:web:e47b8cd804860fc60c1e7c"
};

// ── ENDEREÇO DO SERVIÇO QUE ENTREGA AS FOTOS DO TELEGRAM ──
// Troque pelo endereço real depois que o foto_proxy.py estiver no ar no Render
const FOTO_PROXY_URL = "https://SEU-SERVICO-DE-FOTOS.onrender.com";

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const docRef = doc(db, "dados", "producao");

const statusMeta = {
  aguardando: { label: "Aguardando", cls: "wait" },
  bordado:    { label: "Bordado",    cls: "bordado" },
  costura:    { label: "Costura",    cls: "costura" },
  pronto:     { label: "Pronto",     cls: "pronto" },
};
const statusOrderList = ["aguardando", "bordado", "costura", "pronto"];

let pedidos = [];
let activeFilter = "pendentes";

function fotoUrl(fileId){
  if(!fileId) return null;
  return `${FOTO_PROXY_URL}/foto/${fileId}`;
}

function thumbHtml(fileId, fallback){
  const url = fotoUrl(fileId);
  return url ? `<img src="${url}" loading="lazy" onerror="this.parentElement.innerHTML='${fallback}'">` : fallback;
}

function renderFeed(){
  const feed = document.getElementById('feed');
  let list;
  if (activeFilter === "pendentes") {
    list = pedidos.filter(p => p.status !== "pronto");
  } else {
    list = pedidos.filter(p => p.status === activeFilter);
  }
  // ordena por prazo (texto) — mais simples: mantém ordem de criação
  if (list.length === 0) {
    feed.innerHTML = `<div class="empty"><div class="big">🧺</div>Nenhum pedido aqui no momento.</div>`;
    return;
  }
  feed.innerHTML = "";
  list.forEach(p => {
    const meta = statusMeta[p.status] || statusMeta.aguardando;
    const card = document.createElement('div');
    card.className = "card";
    card.innerHTML = `
      <div class="top">
        <div class="thumbs-wrap">
          <div class="thumb a">${thumbHtml(p.fotoRefFileId, '📷')}</div>
          <div class="thumb b">${thumbHtml(p.fotoBordadoFileId, '🧵')}</div>
        </div>
        <div class="info">
          <p class="name">${p.cliente || ''}</p>
          <p class="product">${p.produto || ''}</p>
        </div>
      </div>
      <div class="meta-row">
        <span class="prazo">Entrega <b>${p.prazo || '—'}</b></span>
        <span class="status-pill" style="background:var(--${meta.cls}-bg); color:var(--${meta.cls})">${meta.label}</span>
      </div>
    `;
    card.addEventListener('click', () => openDetail(p.id));
    feed.appendChild(card);
  });
}

function openDetail(id){
  const p = pedidos.find(x => x.id === id);
  if(!p) return;
  const sheet = document.getElementById('sheet');
  sheet.innerHTML = `
    <div class="grabber"></div>
    <h2>${p.cliente || ''}</h2>
    <div class="sub">Entrega em ${p.prazo || '—'} · Loja ${p.loja || ''}</div>
    <div class="photo-row">
      <div class="photo-box">${thumbHtml(p.fotoRefFileId, '📷')}<small>Referência</small></div>
      <div class="photo-box">${thumbHtml(p.fotoBordadoFileId, '🧵')}<small>Bordado aprovado</small></div>
    </div>
    <div class="detail-block">
      <div class="k">Produto</div>
      <div class="v">${p.produto || ''}</div>
    </div>
    <div class="detail-block">
      <div class="k">Detalhes combinados com a cliente</div>
      <div class="v">${p.detalhes || '(nenhum)'}</div>
    </div>
    <div class="detail-block">
      <div class="k">Status</div>
      <div class="status-buttons" id="statusButtons"></div>
    </div>
    <button class="close-btn" id="closeSheet">Fechar</button>
  `;
  const btnWrap = sheet.querySelector('#statusButtons');
  statusOrderList.forEach(key => {
    const meta = statusMeta[key];
    const btn = document.createElement('button');
    btn.className = "status-btn";
    if (p.status === key) {
      btn.style.background = `var(--${meta.cls}-bg)`;
      btn.style.borderColor = `var(--${meta.cls})`;
      btn.style.color = `var(--${meta.cls})`;
    }
    btn.innerHTML = `<span class="dot" style="background:var(--${meta.cls})"></span>${meta.label}`;
    btn.addEventListener('click', () => atualizarStatus(id, key));
    btnWrap.appendChild(btn);
  });
  sheet.querySelector('#closeSheet').addEventListener('click', closeDetail);
  document.getElementById('backdrop').classList.add('open');
}

async function atualizarStatus(id, novoStatus){
  const novaLista = pedidos.map(p => p.id === id ? { ...p, status: novoStatus } : p);
  try {
    await updateDoc(docRef, { pedidos: novaLista });
    closeDetail();
  } catch (e) {
    alert("Não consegui salvar agora. Verifica sua internet e tenta de novo.");
    console.error(e);
  }
}

function closeDetail(){
  document.getElementById('backdrop').classList.remove('open');
}
document.getElementById('backdrop').addEventListener('click', (e) => {
  if (e.target.id === 'backdrop') closeDetail();
});

document.getElementById('tabs').addEventListener('click', (e) => {
  const tab = e.target.closest('.tab');
  if (!tab) return;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  activeFilter = tab.dataset.filter;
  renderFeed();
});

// Escuta o Firestore em tempo real
onSnapshot(docRef, (snap) => {
  const data = snap.exists() ? snap.data() : { pedidos: [] };
  pedidos = data.pedidos || [];
  renderFeed();
}, (err) => {
  document.getElementById('feed').innerHTML =
    `<div class="empty"><div class="big">⚠️</div>Não consegui carregar os pedidos.<br><small>${err.message}</small></div>`;
});
</script>
</body>
</html>
